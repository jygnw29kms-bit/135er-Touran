name: Publish Touran APK Release

on:
  push:
    branches: [ main ]
    paths:
      - '.github/workflows/publish-touran-apk-release.yml'
  workflow_dispatch:

permissions:
  contents: write
  actions: read

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Download validated Android artifact
        uses: actions/download-artifact@v4
        with:
          name: TouranLive-debug
          path: dist/android
          github-token: ${{ github.token }}
          run-id: 39818312820

      - name: Prepare release APK
        run: |
          set -euo pipefail
          test -f dist/android/TouranLive-debug.apk
          cp dist/android/TouranLive-debug.apk dist/android/TouranLive-0.7.3-USB.apk
          sha256sum dist/android/TouranLive-0.7.3-USB.apk

      - name: Publish release asset
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          tag='touranlive-0.7.3-usb'
          if gh release view "$tag" >/dev/null 2>&1; then
            gh release upload "$tag" dist/android/TouranLive-0.7.3-USB.apk --clobber
          else
            gh release create "$tag" dist/android/TouranLive-0.7.3-USB.apk \
              --title 'TouranLive 0.7.3 USB' \
              --notes 'Validated USB-only weekend build for ESP32-S3-CAN-2CH-U.'
          fi
