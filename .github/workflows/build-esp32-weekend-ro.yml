name: Build ESP32 Weekend Read-Only

on:
  workflow_dispatch:
  push:
    branches: [ esp32-weekend-ro-20261021 ]
    paths:
      - "esp32-firmware/**"
      - ".github/workflows/build-esp32-weekend-ro.yml"

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Enforce weekend safety profile
        shell: python
        run: |
          from pathlib import Path
          import re

          p = Path('esp32-firmware/components/esp_bsp/bsp_xl2515.c')
          s = p.read_text()
          pat = r'bool bsp_xl2515_send\(uint32_t can_id, const uint8_t \*data, uint8_t len, bool extd\)\n\{.*?\n\}\n\nstatic bool xl_recv_one'
          rep = '''bool bsp_xl2515_send(uint32_t can_id, const uint8_t *data, uint8_t len, bool extd)\n{\n    (void)can_id; (void)data; (void)len; (void)extd;\n    ESP_LOGW(TAG, "CAN CH2 TX blocked: vehicle-test firmware is read-only");\n    return false;\n}\n\nstatic bool xl_recv_one'''
          s, n = re.subn(pat, rep, s, flags=re.S)
          if n != 1:
              raise SystemExit(f'CAN2 TX hard-block patch count={n}')

          pat = r'bool bsp_xl2515_set_rate\(uint32_t kbps\)\n\{.*?\n\}\n\nuint32_t bsp_xl2515_get_rate'
          rep = '''bool bsp_xl2515_set_rate(uint32_t kbps)\n{\n    if (kbps == 100 && s_xl_ready && s_can2_bitrate_kbps == 100) return true;\n    ESP_LOGW(TAG, "CAN CH2 bitrate change blocked: weekend vehicle-test profile is fixed at 100 kbit/s");\n    return false;\n}\n\nuint32_t bsp_xl2515_get_rate'''
          s, n = re.subn(pat, rep, s, flags=re.S)
          if n != 1:
              raise SystemExit(f'CAN2 bitrate-lock patch count={n}')
          p.write_text(s)

          p = Path('esp32-firmware/components/esp_bsp/bsp_can.c')
          s = p.read_text()
          pat = r'esp_err_t bsp_can1_set_rate\(uint32_t kbps\)\n\{.*?\n\}\n\nbool bsp_can1_send'
          rep = '''esp_err_t bsp_can1_set_rate(uint32_t kbps)\n{\n    if (kbps == 500 && s_can1_ready && s_can1_bitrate_kbps == 500) return ESP_OK;\n    ESP_LOGW(TAG, "CAN CH1 bitrate change blocked: weekend vehicle-test profile is fixed at 500 kbit/s");\n    return ESP_ERR_NOT_SUPPORTED;\n}\n\nbool bsp_can1_send'''
          s, n = re.subn(pat, rep, s, flags=re.S)
          if n != 1:
              raise SystemExit(f'CAN1 bitrate-lock patch count={n}')
          p.write_text(s)

          p = Path('esp32-firmware/components/esp_bsp/waveshare_twai_port.c')
          s = p.read_text()
          s, n = re.subn(r'\n\s*ESP_RETURN_ON_ERROR\(bsp_web_start_event_task\(\), TAG, "event task start failed"\);',
                         '\n    // Scheduled CAN events disabled in weekend vehicle-test profile.', s)
          if n not in (0, 1):
              raise SystemExit(f'event-task patch count={n}')
          p.write_text(s)

      - name: Verify hard read-only guards
        shell: python
        run: |
          from pathlib import Path

          files = {
              'sdk': Path('esp32-firmware/sdkconfig.defaults').read_text(),
              'can1': Path('esp32-firmware/components/esp_bsp/bsp_can.c').read_text(),
              'can2': Path('esp32-firmware/components/esp_bsp/bsp_xl2515.c').read_text(),
              'port': Path('esp32-firmware/components/esp_bsp/waveshare_twai_port.c').read_text(),
              'gateway': Path('esp32-firmware/main/touran_gateway.c').read_text(),
          }
          required = [
              ('16MB flash', 'CONFIG_ESPTOOLPY_FLASHSIZE_16MB=y' in files['sdk']),
              ('CAN1 listen-only', 'TWAI_MODE_LISTEN_ONLY' in files['can1']),
              ('CAN1 TX hard block', 'CAN CH1 TX blocked' in files['can1']),
              ('CAN1 fixed 500k', 'fixed at 500 kbit/s' in files['can1']),
              ('CAN2 listen-only', 'XL_REQOP_LISTEN_ONLY' in files['can2']),
              ('CAN2 TX hard block', 'CAN CH2 TX blocked' in files['can2']),
              ('CAN2 fixed 100k', 'fixed at 100 kbit/s' in files['can2']),
              ('scheduled events disabled', 'bsp_web_start_event_task()' not in files['port']),
              ('gateway version', '0.4.0-usb-weekend-ro' in files['gateway']),
              ('USB Serial/JTAG driver', 'usb_serial_jtag_driver_install' in files['gateway']),
              ('USB transport advertised', 'usb-serial-jtag' in files['gateway']),
              ('Wi-Fi false advertised', '\\"wifi\\":false' in files['gateway']),
              ('web init disabled', 'bsp_web_init()' not in files['port']),
              ('no Wi-Fi calls in gateway', 'esp_wifi_' not in files['gateway']),
              ('MFA nav rejected/read-only', 'mfa_nav' in files['gateway']),
              ('MFA compass rejected/read-only', 'mfa_compass' in files['gateway']),
              ('OTA rejected/read-only', 'ota' in files['gateway']),
              ('hard block advertised', 'tx_hard_blocked' in files['gateway']),
          ]
          all_sources = '\n'.join(p.read_text(errors='ignore') for p in Path('esp32-firmware').rglob('*') if p.is_file() and p.suffix in {'.c','.h'})
          required.append(('no direct twai_transmit', 'twai_transmit(' not in all_sources))
          failed = [name for name, ok in required if not ok]
          for name, ok in required:
              print(f"{'OK' if ok else 'FAIL'}: {name}")
          if failed:
              raise SystemExit('Safety verification failed: ' + ', '.join(failed))

      - name: Install ESP-IDF 5.5.2
        uses: espressif/install-esp-idf-action@v1
        with:
          version: "v5.5.2"
      - name: Configure target
        working-directory: esp32-firmware
        run: idf.py set-target esp32s3
      - name: Build firmware
        working-directory: esp32-firmware
        run: idf.py build
      - name: Collect flash artifacts
        shell: bash
        run: |
          mkdir -p dist/esp32-weekend
          cp esp32-firmware/build/bootloader/bootloader.bin dist/esp32-weekend/
          cp esp32-firmware/build/partition_table/partition-table.bin dist/esp32-weekend/
          cp esp32-firmware/build/*.bin dist/esp32-weekend/
          cp esp32-firmware/build/flasher_args.json dist/esp32-weekend/
          printf '0.4.0-usb-weekend-ro\n16MB Waveshare flash profile\nUSB Serial/JTAG productive transport\nWi-Fi AP and web server disabled\nCAN1=500k listen-only + TX hard block + bitrate lock\nCAN2=100k listen-only + TX hard block + bitrate lock\nScheduled CAN events disabled\n' > dist/esp32-weekend/BUILD_PROFILE.txt
          sha256sum dist/esp32-weekend/* > dist/esp32-weekend/SHA256SUMS.txt
      - uses: actions/upload-artifact@v4
        with:
          name: 135er-Touran-ESP32-Weekend-ReadOnly
          path: dist/esp32-weekend/
