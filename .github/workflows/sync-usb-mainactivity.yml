name: Sync USB MainActivity

on:
  push:
    branches: [ esp32-weekend-ro-20261021 ]
    paths:
      - "tools/usb-mainactivity.patch"
      - ".github/workflows/sync-usb-mainactivity.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: esp32-weekend-ro-20261021
      - name: Fix USB receiver registration
        shell: python
        run: |
          from pathlib import Path
          p = Path('android-app/app/src/main/java/de/growcentral/touranlive/MainActivity.java')
          s = p.read_text()
          if 'import androidx.core.content.ContextCompat;' not in s:
              marker = 'import android.widget.Toast;\n\n'
              if marker not in s:
                  raise SystemExit('Toast import marker not found')
              s = s.replace(marker, marker + 'import androidx.core.content.ContextCompat;\n\n', 1)
          old = '''        IntentFilter usbFilter = new IntentFilter(ACTION_USB_PERMISSION);\n        if (Build.VERSION.SDK_INT >= 33) registerReceiver(usbPermissionReceiver, usbFilter, RECEIVER_NOT_EXPORTED);\n        else registerReceiver(usbPermissionReceiver, usbFilter);\n'''
          new = '''        IntentFilter usbFilter = new IntentFilter(ACTION_USB_PERMISSION);\n        ContextCompat.registerReceiver(this, usbPermissionReceiver, usbFilter,\n                ContextCompat.RECEIVER_NOT_EXPORTED);\n'''
          if old in s:
              s = s.replace(old, new, 1)
          elif new not in s:
              raise SystemExit('USB receiver registration block not found')
          p.write_text(s)
      - name: Verify source
        run: |
          set -euo pipefail
          grep -q 'ContextCompat.RECEIVER_NOT_EXPORTED' android-app/app/src/main/java/de/growcentral/touranlive/MainActivity.java
          git diff --check
      - name: Commit synchronized MainActivity
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add android-app/app/src/main/java/de/growcentral/touranlive/MainActivity.java
          if git diff --cached --quiet; then
            echo "MainActivity already synchronized"
            exit 0
          fi
          git commit -m "Fix USB receiver registration"
          git push origin HEAD:esp32-weekend-ro-20261021
