name: Deploy Touran API

on:
  push:
    branches: [ main ]
    paths:
      - 'server/api/upload-log.php'
      - 'tests/test_upload_api.py'
      - '.github/workflows/deploy-touran-api.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deploy-api:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate PHP source
        run: php -l server/api/upload-log.php
      - name: Test upload API locally
        run: python3 tests/test_upload_api.py -v
      - name: Install sshpass
        run: sudo apt-get update -qq && sudo apt-get install -y -qq sshpass
      - name: Deploy upload endpoint only
        env:
          SSHPASS: ${{ secrets.SSH_PASSWORD }}
          DEPLOY_HOST: ${{ secrets.SFTP_HOST }}
          DEPLOY_PORT: ${{ secrets.SFTP_PORT }}
          DEPLOY_USER: ${{ secrets.SSH_USERNAME }}
        run: |
          set -euo pipefail
          test -n "$SSHPASS"
          test -n "$DEPLOY_HOST"
          test -n "$DEPLOY_PORT"
          test -n "$DEPLOY_USER"
          mkdir -p ~/.ssh
          chmod 700 ~/.ssh
          sshpass -e scp -P "$DEPLOY_PORT" -o StrictHostKeyChecking=accept-new server/api/upload-log.php "$DEPLOY_USER@$DEPLOY_HOST:/var/www/vhosts/dezender.de/httpdocs/touran/api/upload-log.php"
          sshpass -e ssh -p "$DEPLOY_PORT" -o StrictHostKeyChecking=accept-new "$DEPLOY_USER@$DEPLOY_HOST" "php -l /var/www/vhosts/dezender.de/httpdocs/touran/api/upload-log.php && mkdir -p /var/www/vhosts/dezender.de/private/touran-logs && chmod 0770 /var/www/vhosts/dezender.de/private/touran-logs"
      - name: Validate live upload endpoint
        run: |
          set -euo pipefail
          response="$(curl -fsS -X POST 'https://www.dezender.de/touran/api/upload-log.php' \
            -H 'Content-Type: text/plain; charset=utf-8' \
            -H 'X-Touran-Install: ci-validation' \
            -H 'X-Touran-Session: deploy-check' \
            -H 'X-Touran-App: ci' \
            -H 'X-Touran-Report: raw-can-live' \
            --data-binary $'TouranLive raw CAN live\ngateway_session;gateway_ts_us;channel;can_id;frame_type;data_hex\nci;1;CH1;0x1;STD;00\n')"
          echo "$response"
          echo "$response" | grep -q '"ok":true'
