name: Build Private Touran Install PDF

on:
  workflow_dispatch:
  push:
    branches: [ private-install-pdf-real-images ]
    paths:
      - 'tools/build_private_install_pdf.py'
      - '.github/workflows/build-private-install-pdf.yml'

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install dependencies
        run: python -m pip install --upgrade pip reportlab pillow requests
      - name: Build PDF with original source images
        run: python tools/build_private_install_pdf.py
      - uses: actions/upload-artifact@v4
        with:
          name: Touran-1T3-ESP32-CAN-Einbauanleitung-Originalbilder
          path: dist/Touran_1T3_ESP32_CAN_Einbauanleitung_Originalbilder.pdf
